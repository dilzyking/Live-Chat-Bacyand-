<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wire · general</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── reset & tokens ── */
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 15% 0%, rgba(242,169,59,0.06), transparent 40%), #0E1420;
      color: #E8EDF4;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── login card ── */
    #login {
      width: min(420px, 92vw);
      background: #141C2B;
      border: 1px solid #2A3550;
      border-radius: 10px;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }
    #login::before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #F2A93B, transparent);
      animation: sweep 2.6s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .18em;
      color: #F2A93B;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .sub {
      color: #7C8AA0;
      font-size: 14px;
      margin: 0 0 28px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #7C8AA0;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #1B2436;
      border: 1px solid #2A3550;
      border-radius: 6px;
      padding: 11px 12px;
      color: #E8EDF4;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #F2A93B; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: .06em;
      font-size: 13px;
    }
    #connectBtn {
      width: 100%;
      padding: 13px;
      background: #F2A93B;
      color: #1a1206;
      text-transform: uppercase;
      transition: filter .15s, transform .1s;
    }
    #connectBtn:hover { filter: brightness(1.08); }
    #connectBtn:active { transform: scale(.98); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #7C8AA0;
      text-align: center;
    }
    .fixed-channel {
      background: #1B2436;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      color: #E8EDF4;
      border: 1px solid #2A3550;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fixed-channel .hash {
      color: #F2A93B;
      font-weight: 700;
    }
    .saved-badge {
      font-size: 11px;
      color: #4FD1A5;
      margin-left: auto;
      background: rgba(79,209,165,0.12);
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* ── chat panel ── */
    #chat {
      display: none;
      width: min(760px, 94vw);
      height: min(680px, 92vh);
      background: #141C2B;
      border: 1px solid #2A3550;
      border-radius: 10px;
      overflow: hidden;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #2A3550;
      background: #1B2436;
    }
    .channel { display: flex; align-items: center; gap: 10px; }
    .channel .hash { color: #F2A93B; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .channel h2 { font-size: 15px; margin: 0; font-weight: 600; }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7C8AA0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #7C8AA0; }
    .dot.live { background: #4FD1A5; box-shadow: 0 0 0 0 rgba(79,209,165,.6); animation: pulse 1.8s infinite; }
    .dot.down { background: #E8637A; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79,209,165,.55); }
      70% { box-shadow: 0 0 0 8px rgba(79,209,165,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,209,165,0); }
    }

    #users {
      padding: 8px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #7C8AA0;
      border-bottom: 1px solid #2A3550;
      background: rgba(255,255,255,0.015);
      white-space: nowrap;
      overflow-x: auto;
    }
    #users b { color: #E8EDF4; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 78%; }
    .msg .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #7C8AA0;
      margin-bottom: 3px;
      letter-spacing: .02em;
    }
    .msg .bubble {
      background: #1B2436;
      border: 1px solid #2A3550;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.mine { align-self: flex-end; }
    .msg.mine .bubble { background: rgba(242,169,59,0.14); border-color: #8A6526; }
    .msg.mine .meta { text-align: right; }
    .system {
      align-self: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #7C8AA0;
      padding: 2px 10px;
    }
    #typing {
      min-height: 18px;
      padding: 0 20px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #F2A93B;
    }

    form#composer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #2A3550;
      background: #1B2436;
    }
    #text {
      flex: 1;
      background: #141C2B;
      border: 1px solid #2A3550;
      border-radius: 6px;
      padding: 11px 12px;
      color: #E8EDF4;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }
    #text:focus { border-color: #F2A93B; }
    #sendBtn {
      padding: 0 20px;
      background: #F2A93B;
      color: #1a1206;
      text-transform: uppercase;
    }
    #sendBtn:hover { filter: brightness(1.08); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2A3550; border-radius: 8px; }
  </style>
</head>
<body>

<!-- LOGIN — name is cached, channel fixed to "general" -->
<div id="login">
  <div class="eyebrow mono">// live channel — no history saved</div>
  <h1>Wire</h1>
  <p class="sub">Pick a callsign and join the <strong>#general</strong> channel. Your name is saved in your browser.</p>

  <label for="nameInput">Your callsign</label>
  <input id="nameInput" maxlength="24" placeholder="e.g. StarChat" />

  <!-- fixed channel display (read‑only) -->
  <div class="fixed-channel">
    <span class="hash">#</span> general 
    <span class="saved-badge" id="savedBadge">⚡ saved</span>
  </div>

  <button id="connectBtn">⚡ Start chat</button>
  <div class="hint">Everyone who joins #general sees the same conversation.</div>
</div>

<!-- CHAT -->
<div id="chat">
  <header>
    <div class="channel">
      <span class="hash mono">#</span>
      <h2 id="roomLabel">general</h2>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting</span>
    </div>
  </header>
  <div id="users" class="mono">online: —</div>
  <div id="messages"></div>
  <div id="typing"></div>
  <form id="composer">
    <input id="text" autocomplete="off" placeholder="Type a message..." maxlength="2000" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
(() => {
  const loginEl = document.getElementById('login');
  const chatEl = document.getElementById('chat');
  const nameInput = document.getElementById('nameInput');
  const connectBtn = document.getElementById('connectBtn');
  const roomLabel = document.getElementById('roomLabel');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const usersEl = document.getElementById('users');
  const messagesEl = document.getElementById('messages');
  const typingEl = document.getElementById('typing');
  const composer = document.getElementById('composer');
  const textInput = document.getElementById('text');
  const savedBadge = document.getElementById('savedBadge');

  // ── fixed channel ──
  const FIXED_ROOM = 'general';
  const STORAGE_KEY = 'wire_username';

  let ws = null;
  let myName = '';
  let typingTimeout = null;
  let typingClearTimer = null;

  // ── load saved name ──
  function loadSavedName() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      nameInput.value = saved;
      savedBadge.textContent = '💾 saved';
      savedBadge.style.color = '#4FD1A5';
    } else {
      savedBadge.textContent = '✨ new';
      savedBadge.style.color = '#F2A93B';
    }
  }
  loadSavedName();

  // ── save name on connect ──
  function saveName(name) {
    if (name && name.trim().length > 0) {
      localStorage.setItem(STORAGE_KEY, name.trim());
      savedBadge.textContent = '💾 saved';
      savedBadge.style.color = '#4FD1A5';
    }
  }

  function setStatus(state) {
    statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'down' ? ' down' : '');
    statusText.textContent = state === 'live' ? 'live' : state === 'down' ? 'disconnected' : 'connecting';
  }

  function addMessage({ name, text, ts }) {
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (name === myName ? ' mine' : '');
    const time = new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    wrap.innerHTML = `<div class="meta">${escapeHtml(name)} · ${time}</div><div class="bubble"></div>`;
    wrap.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(wrap);
    scrollDown();
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'system mono';
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function connect(name) {
    const room = FIXED_ROOM;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`;
    ws = new WebSocket(url);
    setStatus('connecting');

    ws.addEventListener('open', () => setStatus('live'));
    ws.addEventListener('close', () => setStatus('down'));
    ws.addEventListener('error', () => setStatus('down'));

    ws.addEventListener('message', (evt) => {
      const data = JSON.parse(evt.data);

      if (data.type === 'welcome') {
        myName = data.name;
        roomLabel.textContent = data.room;
        messagesEl.innerHTML = '';
        data.history.forEach(addMessage);
      } else if (data.type === 'message') {
        addMessage(data);
      } else if (data.type === 'system') {
        addSystem(data.text);
      } else if (data.type === 'presence') {
        usersEl.innerHTML = 'online: <b>' + data.users.map(escapeHtml).join('</b>, <b>') + '</b>';
      } else if (data.type === 'typing') {
        typingEl.textContent = `${data.name} is typing...`;
        clearTimeout(typingClearTimer);
        typingClearTimer = setTimeout(() => (typingEl.textContent = ''), 1800);
      }
    });
  }

  // ── connect on button click ──
  connectBtn.addEventListener('click', () => {
    const rawName = nameInput.value.trim();
    const name = rawName || 'StarChat';
    // save to localStorage
    saveName(name);
    // hide login, show chat
    loginEl.style.display = 'none';
    chatEl.style.display = 'flex';
    connect(name);
  });

  // Enter key on name input triggers connect
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connectBtn.click();
  });

  // ── send message ──
  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    textInput.value = '';
  });

  // ── typing indicator ──
  textInput.addEventListener('input', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => ws.send(JSON.stringify({ type: 'typing' })), 150);
  });

  // ── if name is already saved, focus the input but keep it ready ──
  // we also auto-fill a default if empty
  if (!nameInput.value) {
    nameInput.value = 'StarChat';
  }
})();
</script>
</body>
</html>
