<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wire — live channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420;
    --panel:#141C2B;
    --panel-2:#1B2436;
    --line:#2A3550;
    --text:#E8EDF4;
    --muted:#7C8AA0;
    --amber:#F2A93B;
    --amber-dim:#8A6526;
    --green:#4FD1A5;
    --red:#E8637A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(242,169,59,0.06), transparent 40%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Login screen ---------- */
  #login{
    width:min(420px, 92vw);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:36px 32px;
    position:relative;
    overflow:hidden;
  }
  #login::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    animation:sweep 2.6s linear infinite;
  }
  @keyframes sweep{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.5;}
  label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    margin-bottom:18px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--amber);}
  button{
    cursor:pointer;
    border:none;
    border-radius:6px;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    letter-spacing:.06em;
    font-size:13px;
  }
  #connectBtn{
    width:100%;
    padding:13px;
    background:var(--amber);
    color:#1a1206;
    text-transform:uppercase;
    transition:filter .15s, transform .1s;
  }
  #connectBtn:hover{filter:brightness(1.08);}
  #connectBtn:active{transform:scale(.98);}
  .hint{margin-top:14px; font-size:12px; color:var(--muted); text-align:center;}

  /* ---------- Chat screen ---------- */
  #chat{
    display:none;
    width:min(760px, 94vw);
    height:min(680px, 92vh);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  .channel{display:flex; align-items:center; gap:10px;}
  .channel .hash{color:var(--amber); font-family:'JetBrains Mono',monospace; font-weight:700;}
  .channel h2{font-size:15px; margin:0; font-weight:600;}
  .status{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted);}
  .dot.live{background:var(--green); box-shadow:0 0 0 0 rgba(79,209,165,.6); animation:pulse 1.8s infinite;}
  .dot.down{background:var(--red);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(79,209,165,.55);}
    70%{box-shadow:0 0 0 8px rgba(79,209,165,0);}
    100%{box-shadow:0 0 0 0 rgba(79,209,165,0);}
  }

  #users{
    padding:8px 20px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.015);
    white-space:nowrap;
    overflow-x:auto;
  }
  #users b{color:var(--text);}

  #messages{
    flex:1;
    overflow-y:auto;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{max-width:78%;}
  .msg .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:3px;
    letter-spacing:.02em;
  }
  .msg .bubble{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
    font-size:14px;
    line-height:1.45;
    word-wrap:break-word;
  }
  .msg.mine{align-self:flex-end;}
  .msg.mine .bubble{background:rgba(242,169,59,0.14); border-color:var(--amber-dim);}
  .msg.mine .meta{text-align:right;}
  .system{
    align-self:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    padding:2px 10px;
  }
  #typing{
    min-height:18px;
    padding:0 20px 6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--amber);
  }

  form#composer{
    display:flex;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--line);
    background:var(--panel-2);
  }
  #text{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  #text:focus{border-color:var(--amber);}
  #sendBtn{
    padding:0 20px;
    background:var(--amber);
    color:#1a1206;
    text-transform:uppercase;
  }
  #sendBtn:hover{filter:brightness(1.08);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <div class="eyebrow mono">// live channel — no history saved to a database</div>
    <h1>Wire</h1>
    <p class="sub">Pick a callsign and a channel. Messages are relayed live between everyone connected — held in server memory only, not written to any database.</p>
    <label for="nameInput">Callsign</label>
    <input id="nameInput" maxlength="24" placeholder="e.g. Alex" />
    <label for="roomInput">Channel</label>
    <input id="roomInput" maxlength="40" placeholder="e.g. general" value="general" />
    <button id="connectBtn">Connect</button>
    <div class="hint">Anyone who joins the same channel name lands in the same room.</div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <header>
      <div class="channel">
        <span class="hash mono">#</span>
        <h2 id="roomLabel">general</h2>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">connecting</span>
      </div>
    </header>
    <div id="users" class="mono">online: —</div>
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="composer">
      <input id="text" autocomplete="off" placeholder="Type a message…" maxlength="2000" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

<script>
(() => {
  const loginEl = document.getElementById('login');
  const chatEl = document.getElementById('chat');
  const nameInput = document.getElementById('nameInput');
  const roomInput = document.getElementById('roomInput');
  const connectBtn = document.getElementById('connectBtn');
  const roomLabel = document.getElementById('roomLabel');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const usersEl = document.getElementById('users');
  const messagesEl = document.getElementById('messages');
  const typingEl = document.getElementById('typing');
  const composer = document.getElementById('composer');
  const textInput = document.getElementById('text');

  let ws = null;
  let myName = '';
  let typingTimeout = null;
  let typingClearTimer = null;

  function setStatus(state){
    // state: 'connecting' | 'live' | 'down'
    statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'down' ? ' down' : '');
    statusText.textContent = state === 'live' ? 'live' : state === 'down' ? 'disconnected' : 'connecting';
  }

  function addMessage({ name, text, ts }){
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (name === myName ? ' mine' : '');
    const time = new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    wrap.innerHTML = `<div class="meta">${escapeHtml(name)} · ${time}</div><div class="bubble"></div>`;
    wrap.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(wrap);
    scrollDown();
  }

  function addSystem(text){
    const el = document.createElement('div');
    el.className = 'system mono';
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function scrollDown(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function connect(name, room){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`;
    ws = new WebSocket(url);
    setStatus('connecting');

    ws.addEventListener('open', () => setStatus('live'));
    ws.addEventListener('close', () => setStatus('down'));
    ws.addEventListener('error', () => setStatus('down'));

    ws.addEventListener('message', (evt) => {
      const data = JSON.parse(evt.data);

      if (data.type === 'welcome') {
        myName = data.name;
        roomLabel.textContent = data.room;
        messagesEl.innerHTML = '';
        data.history.forEach(addMessage);
      } else if (data.type === 'message') {
        addMessage(data);
      } else if (data.type === 'system') {
        addSystem(data.text);
      } else if (data.type === 'presence') {
        usersEl.innerHTML = 'online: <b>' + data.users.map(escapeHtml).join('</b>, <b>') + '</b>';
      } else if (data.type === 'typing') {
        typingEl.textContent = `${data.name} is typing…`;
        clearTimeout(typingClearTimer);
        typingClearTimer = setTimeout(() => (typingEl.textContent = ''), 1800);
      }
    });
  }

  connectBtn.addEventListener('click', () => {
    const name = nameInput.value.trim() || 'Guest';
    const room = roomInput.value.trim() || 'general';
    loginEl.style.display = 'none';
    chatEl.style.display = 'flex';
    connect(name, room);
  });

  [nameInput, roomInput].forEach((el) =>
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectBtn.click(); })
  );

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    textInput.value = '';
  });

  textInput.addEventListener('input', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => ws.send(JSON.stringify({ type: 'typing' })), 150);
  });
})();
</script>
</body>
      </html>
