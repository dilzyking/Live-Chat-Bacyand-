<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101620" />
  <title>MATCHDEKHO Live Chat</title>

  <style>
    @font-face {
      font-family: "Outfit";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("https://allrounderlive.com/font.woff2") format("woff2");
    }
    :root {
      --font: "Outfit", "Inter", "Segoe UI", system-ui, sans-serif;
      --bg: #101620;
      --bg-deep: #0c0f15;
      --surface: #151b26;
      --stroke: #252c39;
      --text: #f4f5f8;
      --muted: #9299a8;
      --accent: #ff6412;
      --accent-hi: #ff7a2e;
      --accent-soft: rgba(255,100,18,.12);
      --green: #25d366;
      --red: #f34b57;
      --out: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ───────── login ───────── */
    #login {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      background: radial-gradient(ellipse at 50% 0%, rgba(78,131,191,.10), transparent 70%), var(--bg);
    }
    .login-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 400px;
      padding: 30px 26px 24px;
      border: 1px solid #354151;
      border-radius: 14px;
      background: linear-gradient(145deg, #1b2430 0%, #111620 55%, #0d1119 100%);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
      text-align: center;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #ff6412, #ef9d37 30%, #28d369 75%, #128c7e);
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 800; letter-spacing: 1.2px;
      color: #cfd4de;
      margin-bottom: 14px;
    }
    .live-badge i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,100,18,.12);
    }
    .login-card h1 {
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 800;
      letter-spacing: -.9px;
      line-height: 1.12;
      margin-bottom: 8px;
    }
    .login-card .sub { color: #a3acb9; font-size: 13px; line-height: 1.6; margin-bottom: 22px; }
    .field { text-align: left; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: #c6cdd6; margin-bottom: 7px; }
    .field input {
      width: 100%;
      background: #0c111a;
      border: 1px solid #2f3a4b;
      border-radius: 8px;
      padding: 13px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input::placeholder { color: #6c7686; }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,100,18,.14); }
    .field input.bad { border-color: var(--red); }
    .field-error { min-height: 20px; margin-top: 6px; text-align: left; color: #ff7a85; font-size: 12px; }
    .btn-join {
      width: 100%;
      min-height: 46px;
      margin-top: 6px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid var(--accent);
      box-shadow: 0 8px 22px -12px rgba(255,100,18,.9);
      transition: background .2s, transform .15s;
    }
    .btn-join:hover { background: var(--accent-hi); }
    .btn-join:active { transform: scale(.985); }
    .login-note { margin-top: 14px; font-size: 11px; color: #717d8d; }

    /* ───────── chat ───────── */
    #chat {
      display: none;
      position: relative;
      height: 100%;
      flex-direction: column;
    }
    #chat.on { display: flex; }

    /* floating status pill (replaces a header) */
    .pill-wrap {
      position: absolute;
      top: 10px; right: 12px;
      z-index: 10;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      border: 1px solid #2f3846;
      border-radius: 20px;
      background: rgba(12,15,21,.88);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 12px; font-weight: 700; color: #d5dae3;
      transition: border-color .2s, background .2s;
    }
    .pill:hover { border-color: #596578; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6c7686; flex: none; }
    .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(37,211,102,.55); animation: pulse 1.8s infinite; }
    .dot.down { background: var(--red); }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,.5); }
      70% { box-shadow: 0 0 0 7px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }
    .roster-pop {
      display: none;
      position: absolute; top: calc(100% + 8px); right: 0;
      width: 220px; max-height: 260px; overflow-y: auto;
      padding: 10px;
      border: 1px solid #354151;
      border-radius: 10px;
      background: linear-gradient(155deg, #19202c, #111721);
      box-shadow: 0 18px 40px rgba(0,0,0,.5);
    }
    .roster-pop.open { display: block; }
    .roster-pop h3 { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); margin: 2px 4px 8px; }
    .roster-pop ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .roster-pop li { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; min-width: 0; }
    .roster-pop li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .roster-pop li .you { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; }
    .reconnect {
      display: none;
      margin-top: 8px; width: 100%;
      padding: 8px; border-radius: 6px;
      background: var(--accent); color: #fff; font-weight: 800; font-size: 12px;
    }
    .reconnect.show { display: block; }

    /* avatars: round like the channel logos */
    .avatar {
      flex: none;
      display: grid; place-items: center;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid var(--ring, rgba(130,173,218,.32));
      background: radial-gradient(circle at 30% 20%, #273b54, #0d1421 78%);
      color: #e8f1ff;
      font-size: 13px; font-weight: 800;
      box-shadow: inset 0 1px 4px rgba(255,255,255,.07);
    }
    .avatar.sm { width: 28px; height: 28px; font-size: 11px; border-width: 1.5px; }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 54px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #2a3240 transparent;
    }
    .row { display: flex; gap: 9px; max-width: min(560px, 88%); }
    .row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .col { min-width: 0; }
    .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline; }
    .meta b { color: #dfe3ea; font-weight: 700; font-size: 12.5px; }
    .row.mine .meta { justify-content: flex-end; }
    .bubble {
      padding: 9px 13px;
      border: 1px solid #252c38;
      border-radius: 4px 14px 14px 14px;
      background: linear-gradient(155deg, #19202c 0%, #111721 65%, #10141e 100%);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .row.mine .bubble {
      border-color: #ff8a47;
      border-radius: 14px 4px 14px 14px;
      background: linear-gradient(145deg, #ff7a2e, #f0560b);
      color: #fff;
    }
    .bubble.has-img { padding: 5px; }
    .bubble .cap { padding: 6px 8px 3px; }
    .bubble img {
      display: block;
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      cursor: zoom-in;
      background: #0c0f15;
    }
    .expired { font-style: italic; color: var(--muted); }
    .row.mine .expired { color: #ffe3d1; }
    .sys {
      align-self: center;
      font-size: 11.5px; font-weight: 600; color: #8a93a3;
      background: #151b26; border: 1px solid #202631;
      padding: 3px 12px; border-radius: 20px;
    }
    .empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 26ch; line-height: 1.6; }
    .empty b { display: block; color: #e7e9ed; font-size: 16px; margin-bottom: 4px; }

    #typing { min-height: 20px; padding: 0 16px 4px; font-size: 12px; font-weight: 600; color: var(--accent); }

    /* composer */
    .composer-wrap { padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
    #preview {
      display: none; align-items: center; gap: 11px;
      padding: 9px 11px;
      border: 1px solid #2f3846; border-bottom: 0;
      border-radius: 10px 10px 0 0;
      background: #151b26;
    }
    #preview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
    #preview .pinfo { flex: 1; min-width: 0; font-size: 12px; }
    #preview .pinfo b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    #preview .pinfo span { color: var(--muted); }
    #removeImg { font-size: 12px; font-weight: 800; color: #ff7a85; padding: 6px 9px; border-radius: 6px; }
    #removeImg:hover { background: rgba(243,75,87,.12); }

    form#composer {
      display: flex; align-items: center; gap: 6px;
      padding: 5px;
      border: 1px solid #2f3846;
      border-radius: 12px;
      background: var(--bg-deep);
      transition: border-color .2s, box-shadow .2s;
    }
    form#composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,100,18,.12); }
    .has-preview form#composer { border-radius: 0 0 12px 12px; }
    #imageBtn {
      flex: none; width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 9px;
      color: #aab2c0;
      transition: color .2s, background .2s;
    }
    #imageBtn:hover { color: var(--accent); background: var(--accent-soft); }
    #text {
      flex: 1; min-width: 0;
      border: 0; outline: none; background: transparent;
      padding: 10px 6px;
    }
    #text::placeholder { color: #6c7686; }
    #sendBtn {
      flex: none; height: 40px; padding: 0 18px;
      border-radius: 9px;
      background: var(--accent); color: #fff;
      font-weight: 800; font-size: 13px;
      transition: background .2s, transform .15s;
    }
    #sendBtn:hover { background: var(--accent-hi); }
    #sendBtn:active { transform: scale(.97); }

    /* drag overlay */
    #drop {
      display: none; position: absolute; inset: 0; z-index: 30;
      align-items: center; justify-content: center; text-align: center;
      padding: 20px;
      background: rgba(255,100,18,.92);
      color: #fff; font-size: 22px; font-weight: 800; line-height: 1.3;
    }
    #chat.dragging #drop { display: flex; }

    /* toast */
    #toast {
      position: fixed; left: 50%; bottom: 84px;
      transform: translateX(-50%) translateY(16px);
      max-width: 90%;
      padding: 10px 16px;
      border: 1px solid #3a4756; border-radius: 8px;
      background: #202b37; color: #fff;
      font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .25s var(--out);
      z-index: 60;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* lightbox */
    #lightbox {
      display: none; position: fixed; inset: 0; z-index: 70;
      align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(1,3,8,.9);
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    /* blocked screen (same look as the server's 403 page) */
    #blocked {
      position: fixed; inset: 0; z-index: 80;
      display: grid; place-items: center;
      padding: 16px;
      background: var(--bg);
      text-align: center;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 800;
      line-height: 1.2;
    }

    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-thumb { background: #2a3240; border-radius: 8px; }

    @media (max-width: 520px) {
      #messages { padding: 52px 10px 8px; }
      .row { max-width: 94%; }
      .composer-wrap { padding-left: 8px; padding-right: 8px; }
      #sendBtn { padding: 0 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<main id="login">
  <form class="login-card" id="loginForm" novalidate>
    <div class="live-badge"><i aria-hidden="true"></i>MATCHDEKHO LIVE CHAT</div>
    <h1>Join the match chat</h1>
    <p class="sub">Pick a username. Everyone watching sees the same conversation, and you can share images too.</p>

    <div class="field">
      <label for="nameInput">Username</label>
      <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Type your own name" />
    </div>
    <div class="field-error" id="nameError" role="alert"></div>

    <button class="btn-join" type="submit">Join chat</button>
    <p class="login-note">Messages are not saved. Images up to 2 MB.</p>
  </form>
</main>

<!-- CHAT -->
<section id="chat">
  <div class="pill-wrap">
    <button class="pill" id="pillBtn" type="button" aria-expanded="false" aria-controls="rosterPop">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </button>
    <div class="roster-pop" id="rosterPop">
      <h3 id="rosterTitle">ONLINE</h3>
      <ul id="roster"></ul>
      <button class="reconnect" id="reconnect" type="button">Reconnect</button>
    </div>
  </div>

  <div id="messages" aria-live="polite"></div>
  <div id="typing"></div>

  <div class="composer-wrap" id="composerWrap">
    <div id="preview">
      <img id="previewImg" alt="Selected image preview" />
      <div class="pinfo"><b id="previewName"></b><span id="previewSize"></span></div>
      <button type="button" id="removeImg">Remove</button>
    </div>
    <form id="composer" autocomplete="off">
      <input type="file" id="imageInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
      <button type="button" id="imageBtn" title="Send an image" aria-label="Attach an image">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.6"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </button>
      <input id="text" placeholder="Say something about the match" maxlength="2000" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <div id="drop">Drop an image to send it<br><small style="font-weight:600;font-size:14px">PNG, JPEG, GIF or WebP · max 2 MB</small></div>
</section>

<div id="toast" role="status"></div>
<div id="lightbox"><img alt="Full size image" /></div>
<div id="blocked" role="alert" hidden><p id="blockedText"></p></div>

<script>
(() => {
  const ROOM = 'general';
  const STORAGE_KEY = 'matchdekho_chat_username';
  const MAX_IMAGE_BYTES = 2 * 1024 * 1024;
  const ALLOWED = /^image\/(png|jpeg|gif|webp)$/;
  const RINGS = ['#ff8c4a', '#28d369', '#5aa9ff', '#e56bb0', '#f0b429', '#8f8bff'];
  const BLOCK_CLOSE_CODE = 4003;                          // server closes blocked sockets with this code
  const BLOCK_TEXT = 'You Exceed You Limit Bye Bye 👋';  // fallback if the server text is missing

  const $ = (id) => document.getElementById(id);
  const loginEl = $('login'), chatEl = $('chat');
  const loginForm = $('loginForm'), nameInput = $('nameInput'), nameError = $('nameError');
  const pillBtn = $('pillBtn'), rosterPop = $('rosterPop'), roster = $('roster'), rosterTitle = $('rosterTitle');
  const statusDot = $('statusDot'), statusText = $('statusText'), reconnectBtn = $('reconnect');
  const messagesEl = $('messages'), typingEl = $('typing');
  const composer = $('composer'), textInput = $('text');
  const imageBtn = $('imageBtn'), imageInput = $('imageInput');
  const preview = $('preview'), previewImg = $('previewImg');
  const previewName = $('previewName'), previewSize = $('previewSize'), removeImg = $('removeImg');
  const composerWrap = $('composerWrap');
  const toastEl = $('toast');
  const lightbox = $('lightbox'), lightboxImg = lightbox.querySelector('img');
  const blockedEl = $('blocked'), blockedText = $('blockedText');

  let ws = null;
  let myName = '';
  let requestedName = '';
  let onlineCount = 0;
  let pendingImage = null;
  let blocked = false;
  let typingSendTimer = null, typingClearTimer = null, toastTimer = null;

  // Server escapes < and > as entities; we render with textContent, so restore them.
  const decode = (s) => String(s == null ? '' : s).replace(/&lt;/g, '<').replace(/&gt;/g, '>');

  const ringFor = (name) => {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return RINGS[h % RINGS.length];
  };

  function makeAvatar(name, small) {
    const a = document.createElement('div');
    a.className = 'avatar' + (small ? ' sm' : '');
    a.style.setProperty('--ring', ringFor(name));
    a.textContent = (decode(name).trim()[0] || '?').toUpperCase();
    return a;
  }

  function toast(msg, ms = 3200) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  const formatSize = (b) => b < 1048576
    ? Math.max(1, Math.round(b / 1024)) + ' KB'
    : (b / 1048576).toFixed(2) + ' MB';

  // ───────── blocked (abuse limit exceeded) ─────────
  function showBlocked(text) {
    blocked = true;
    try { if (ws) ws.close(); } catch {}
    blockedText.textContent = text || BLOCK_TEXT;
    blockedEl.hidden = false;
    chatEl.classList.remove('on');
    loginEl.style.display = 'none';
    toastEl.classList.remove('show');
  }

  // ───────── login (username is always chosen by the person) ─────────
  let saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch {}
  if (saved) nameInput.value = saved;
  nameInput.focus();

  nameInput.addEventListener('input', () => {
    nameInput.classList.remove('bad');
    nameError.textContent = '';
  });

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.classList.add('bad');
      nameError.textContent = 'Enter a username to join the chat.';
      nameInput.focus();
      return;
    }
    try { localStorage.setItem(STORAGE_KEY, name); } catch {}
    requestedName = name;
    loginEl.style.display = 'none';
    chatEl.classList.add('on');
    connect(name);
    textInput.focus();
  });

  // ───────── connection ─────────
  function setStatus(state) {
    statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'down' ? ' down' : '');
    if (state === 'live') statusText.textContent = 'Live · ' + onlineCount + ' online';
    else statusText.textContent = state === 'down' ? 'Disconnected' : 'Connecting';
    reconnectBtn.classList.toggle('show', state === 'down');
    if (state === 'down') rosterPop.classList.add('open');
  }

  function connect(name) {
    if (blocked) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(ROOM)}&name=${encodeURIComponent(name)}`);
    setStatus('connecting');

    ws.addEventListener('open', () => { if (!blocked) setStatus('live'); });
    ws.addEventListener('close', (e) => {
      if (e.code === BLOCK_CLOSE_CODE) showBlocked();   // never fall back to "Reconnect" once blocked
      else if (!blocked) setStatus('down');
    });
    ws.addEventListener('error', () => { if (!blocked) setStatus('down'); });

    ws.addEventListener('message', (evt) => {
      let data;
      try { data = JSON.parse(evt.data); } catch { return; }

      switch (data.type) {
        case 'welcome':
          myName = data.name;
          messagesEl.textContent = '';
          if (!data.history.length) showEmpty();
          data.history.forEach(addMessage);
          break;
        case 'message':
          clearEmpty();
          addMessage(data);
          break;
        case 'system':
          clearEmpty();
          addSystem(decode(data.text));
          break;
        case 'presence':
          renderRoster(data.users);
          break;
        case 'typing':
          if (data.name !== myName) {
            typingEl.textContent = decode(data.name) + ' is typing…';
            clearTimeout(typingClearTimer);
            typingClearTimer = setTimeout(() => (typingEl.textContent = ''), 1800);
          }
          break;
        case 'error':
          if (data.code === 'blocked' || data.blocked) { showBlocked(data.text); break; }
          // abuse warnings are longer, so keep them on screen a bit more
          toast(data.text || 'Something went wrong.', data.code === 'abuse_warning' ? 6000 : 3200);
          break;
      }
    });
  }

  reconnectBtn.addEventListener('click', () => connect(requestedName));

  // ───────── status pill / online list ─────────
  pillBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = rosterPop.classList.toggle('open');
    pillBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (!rosterPop.contains(e.target) && statusText.textContent !== 'Disconnected') {
      rosterPop.classList.remove('open');
      pillBtn.setAttribute('aria-expanded', 'false');
    }
  });

  function renderRoster(users) {
    onlineCount = users.length;
    roster.textContent = '';
    users.forEach((u) => {
      const li = document.createElement('li');
      li.appendChild(makeAvatar(u, true));
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = decode(u);
      li.appendChild(nm);
      if (u === myName) {
        const you = document.createElement('span');
        you.className = 'you';
        you.textContent = 'YOU';
        li.appendChild(you);
      }
      roster.appendChild(li);
    });
    rosterTitle.textContent = 'ONLINE (' + users.length + ')';
    if (ws && ws.readyState === WebSocket.OPEN) statusText.textContent = 'Live · ' + onlineCount + ' online';
  }

  // ───────── messages ─────────
  function showEmpty() {
    const el = document.createElement('div');
    el.className = 'empty';
    el.id = 'emptyState';
    const b = document.createElement('b');
    b.textContent = 'No messages yet';
    el.append(b, document.createTextNode('Start the talk or share a match photo.'));
    messagesEl.appendChild(el);
  }
  function clearEmpty() {
    const el = $('emptyState');
    if (el) el.remove();
  }

  function addCaption(parent, text, cls) {
    const cap = document.createElement('div');
    cap.className = 'cap' + (cls ? ' ' + cls : '');
    cap.textContent = text;
    parent.appendChild(cap);
  }

  function addMessage(m) {
    const mine = m.name === myName;
    const row = document.createElement('div');
    row.className = 'row' + (mine ? ' mine' : '');
    row.appendChild(makeAvatar(m.name, false));

    const col = document.createElement('div');
    col.className = 'col';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const nameEl = document.createElement('b');
    nameEl.textContent = decode(m.name);
    const timeEl = document.createElement('span');
    timeEl.textContent = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.append(nameEl, timeEl);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (m.image) {
      bubble.classList.add('has-img');
      const img = document.createElement('img');
      img.src = m.image;
      img.alt = 'Image from ' + decode(m.name);
      img.loading = 'lazy';
      img.addEventListener('click', () => { lightboxImg.src = m.image; lightbox.classList.add('open'); });
      img.addEventListener('load', scrollDown);
      bubble.appendChild(img);
      if (m.text) addCaption(bubble, decode(m.text));
    } else if (m.imageExpired) {
      bubble.classList.add('has-img');
      addCaption(bubble, 'This image is no longer available.', 'expired');
      if (m.text) addCaption(bubble, decode(m.text));
    } else {
      bubble.textContent = decode(m.text);
    }

    col.append(meta, bubble);
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  // lightbox
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

  // ───────── image selection ─────────
  function stageImage(file) {
    if (!file) return;
    if (!ALLOWED.test(file.type)) { toast('Only PNG, JPEG, GIF or WebP images can be sent.'); return; }
    if (file.size > MAX_IMAGE_BYTES) { toast('That image is ' + formatSize(file.size) + '. Choose one under 2 MB.'); return; }

    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = { dataUrl: reader.result, name: file.name || 'Pasted image', size: file.size };
      previewImg.src = pendingImage.dataUrl;
      previewName.textContent = pendingImage.name;
      previewSize.textContent = formatSize(pendingImage.size) + ' · add a caption if you like';
      preview.style.display = 'flex';
      composerWrap.classList.add('has-preview');
      textInput.placeholder = 'Add a caption (optional)';
      textInput.focus();
    };
    reader.onerror = () => toast('Could not read that file. Try another image.');
    reader.readAsDataURL(file);
  }

  function clearImage() {
    pendingImage = null;
    preview.style.display = 'none';
    previewImg.removeAttribute('src');
    composerWrap.classList.remove('has-preview');
    textInput.placeholder = 'Say something about the match';
  }

  imageBtn.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    imageInput.value = '';
    stageImage(file);
  });
  removeImg.addEventListener('click', clearImage);

  textInput.addEventListener('paste', (e) => {
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length && files[0].type.startsWith('image/')) {
      e.preventDefault();
      stageImage(files[0]);
    }
  });

  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  chatEl.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; chatEl.classList.add('dragging'); });
  chatEl.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  chatEl.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) chatEl.classList.remove('dragging'); });
  chatEl.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    chatEl.classList.remove('dragging');
    stageImage(e.dataTransfer.files[0]);
  });

  // ───────── sending ─────────
  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!ws || ws.readyState !== WebSocket.OPEN) { toast('You are disconnected. Tap the status pill to reconnect.'); return; }
    const text = textInput.value.trim();

    if (pendingImage) {
      ws.send(JSON.stringify({ type: 'image', image: pendingImage.dataUrl, text }));
      clearImage();
      textInput.value = '';
      return;
    }
    if (!text) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    textInput.value = '';
  });

  textInput.addEventListener('input', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    clearTimeout(typingSendTimer);
    typingSendTimer = setTimeout(() => ws.send(JSON.stringify({ type: 'typing' })), 150);
  });
})();
</script>
</body>
</html>
